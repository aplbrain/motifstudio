# Docker Compose for Motif Studio

version: '3.8'
services:
  motifstudio-web:
    # Lives at ./motifstudio-web/Dockerfile
    build:
      context: ./motifstudio-web
      args:
        # This value is compiled into the static browser bundle. Keep the
        # default deployment pointed at the public API; use
        # docker-compose.local.yml for a developer's local backend.
        NEXT_PUBLIC_API_BASE_URL: https://api.motifstudio.bossdb.org
    ports:
      - "7080:80"
  motifstudio-server:
    # Lives at ./server
    build: ./server
    ports:
      - "7082:8000"

